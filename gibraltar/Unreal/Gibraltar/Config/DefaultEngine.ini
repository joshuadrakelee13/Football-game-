; Gibraltar - engine configuration.
; Lighting is fully dynamic (Lumen GI + reflections, virtual shadow maps), no
; baked lighting, so the level never needs a "Build Lighting" step.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Gibraltar/Maps/L_Gibraltar.L_Gibraltar
EditorStartupMap=/Game/Gibraltar/Maps/L_Gibraltar.L_Gibraltar
GlobalDefaultGameMode=/Script/Gibraltar.GibraltarGameMode
GameInstanceClass=/Script/Gibraltar.GibraltarGameInstance

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Global illumination & reflections: Lumen (software ray tracing so it runs on any DX12 GPU)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
r.GenerateMeshDistanceFields=True
; --- Shadows: virtual shadow maps
r.Shadow.Virtual.Enable=1
; --- No baked/static lighting anywhere
r.AllowStaticLighting=False
; --- Nanite (terrain, buildings and walls are imported with Nanite enabled)
r.Nanite.ProjectEnabled=True
; --- Anti-aliasing: Temporal Super Resolution
r.AntiAliasingMethod=4
; --- Physically based exposure range (EV100). The sky controller drives the limits.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
; --- Sky
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
; --- Misc
r.SkinCache.CompileShaders=True
r.CustomDepth=3

[/Script/Engine.Engine]
; First-person: keep the near plane small so walls you touch don't clip.
NearClipPlane=5.000000
bSmoothFrameRate=False

[/Script/Engine.PhysicsSettings]
; Real gravity (9.80665 m/s^2 -> UE default -980 cm/s^2 is close enough).
DefaultGravityZ=-980.000000

[/Script/Engine.UserInterfaceSettings]
RenderFocusRule=Never
